<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Verify your email · Telos</title>
    <style>
      :root {
        color-scheme: dark;
        --paper: #f4f4f4;
        --paper-edge: #cbd9d7;
        --paper-ink: #15130f;
        --paper-muted: #5f6765;
        --paper-image: url("/telos-paper.jpg");
        --desk: #12161d;
        --desk-raised: #1a1f28;
        --desk-raised-2: #222936;
        --line: rgba(242, 234, 220, .08);
        --line-strong: rgba(242, 234, 220, .15);
        --text: #ede6d8;
        --text-muted: #9a9486;
        --accent: #5aaeaa;
        --accent-hover: #68b8b4;
        --accent-ink: #071817;
        --accent-soft: rgba(90, 174, 170, .12);
        --accent-line: rgba(90, 174, 170, .32);
        --danger: #e08a80;
        --danger-soft: rgba(224, 138, 128, .12);
        --focus-halo: rgba(90, 174, 170, .24);
        --auth-brand-width: 55%;
        --auth-logo-max: 560px;
        --space-1: 4px;
        --space-2: 8px;
        --space-3: 12px;
        --space-4: 16px;
        --space-5: 24px;
        --space-6: 32px;
        --font-ui: "Inter", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
        --font-mono: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, monospace;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-width: 320px;
        background: var(--desk);
        color: var(--text);
        font: 15px/1.55 var(--font-ui);
        -webkit-font-smoothing: antialiased;
      }
      ::selection { background: var(--accent); color: var(--accent-ink); }
      a { color: var(--accent); text-decoration: none; }
      a:hover { color: var(--accent-hover); text-decoration: underline; }
      p { margin: 0 0 14px; }
      h1 { margin: 0 0 12px; font-size: 28px; line-height: 1.15; letter-spacing: -.035em; font-weight: 700; }
      .auth-shell { display: grid; grid-template-columns: minmax(0, var(--auth-brand-width)) minmax(0, 1fr); min-height: 100dvh; background: var(--desk); }
      .auth-brand {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        padding: 48px 0;
        border-right: 1px solid var(--paper-edge);
        background-color: var(--paper);
        background-image: var(--paper-image);
        background-position: center;
        background-size: cover;
        background-repeat: no-repeat;
      }
      .auth-brand-lockup { width: min(var(--auth-logo-max), 60%); }
      .auth-brand img {
        display: block;
        width: 100%;
        max-width: 100%;
        height: auto;
        object-fit: contain;
        filter: drop-shadow(0 10px 30px rgba(21, 19, 15, .08));
      }
      .auth-foot {
        position: absolute;
        left: 50%;
        bottom: 24px;
        transform: translateX(-50%);
        margin: 0;
        color: var(--paper-muted);
        font-family: var(--font-mono);
        font-size: 9.5px;
        line-height: 1.4;
        letter-spacing: .12em;
        text-transform: uppercase;
        white-space: nowrap;
      }
      .auth-main {
        min-width: 0;
        min-height: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 48px;
        background: var(--desk);
        overflow-y: auto;
      }
      .auth-panel { width: 100%; max-width: 380px; margin: auto; }
      .status-panel { padding: 0 0 0 22px; border-left: 3px solid var(--line-strong); }
      .status-panel[data-state="success"] { border-left-color: var(--accent); }
      .status-panel[data-state="error"] { border-left-color: var(--danger); }
      .spinner {
        width: 18px;
        height: 18px;
        margin-bottom: 16px;
        border: 2px solid var(--line);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: telos-spin .7s linear infinite;
      }
      @keyframes telos-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
      .muted { color: var(--text-muted); font-size: 12.5px; line-height: 1.55; }
      .error { color: var(--danger); }
      code { word-break: break-all; padding: 2px 5px; border-radius: 4px; background: var(--desk-raised-2); color: var(--text); font-family: var(--font-mono); font-size: 12px; }
      form { display: flex; gap: 8px; margin-top: 8px; }
      input[type="email"] {
        flex: 1;
        min-width: 0;
        min-height: 46px;
        padding: 0 12px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--desk-raised);
        color: var(--text);
        font: inherit;
        font-size: 14px;
        transition: border-color .15s ease, box-shadow .15s ease, background-color .15s ease;
      }
      ::placeholder { color: var(--text-muted); opacity: 1; }
      input[type="email"]:focus { outline: none; border-color: var(--accent); background: var(--desk-raised-2); box-shadow: 0 0 0 3px var(--focus-halo); }
      button, .button-link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 46px;
        padding: 0 16px;
        border: 1px solid var(--accent);
        border-radius: 10px;
        background: var(--accent);
        color: var(--accent-ink);
        font: inherit;
        font-size: 13.5px;
        font-weight: 650;
        line-height: 1;
        text-decoration: none;
        cursor: pointer;
        transition: background-color .15s ease, border-color .15s ease, transform .15s ease, box-shadow .15s ease;
      }
      button:hover, .button-link:hover { background: var(--accent-hover); border-color: var(--accent-hover); color: var(--accent-ink); text-decoration: none; transform: translateY(-1px); }
      button:active, .button-link:active { transform: translateY(0); }
      button:disabled { opacity: .5; cursor: default; }
      .hidden { display: none !important; }
      .actions { display: flex; align-items: center; flex-wrap: wrap; gap: 20px; margin: 24px 0 0; }
      .actions > a { display: inline-flex; align-items: center; min-height: 44px; font-size: 13px; }
      :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
      @media (max-width: 900px) {
        .auth-shell { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
        .auth-brand {
          justify-content: center;
          height: 152px;
          min-height: 152px;
          padding: 24px;
          border-right: 0;
          border-bottom: 1px solid var(--paper-edge);
          background-size: 1600px auto;
        }
        .auth-brand-lockup { width: min(220px, 68vw); }
        .auth-foot { display: none; }
        .auth-main { justify-content: flex-start; padding: 32px 24px 48px; }
        .auth-panel { margin: 0 auto; }
      }
      @media (max-width: 480px) {
        #resend-form { flex-direction: column; }
        .auth-main { padding: 28px 20px 40px; }
        .auth-brand { height: 144px; min-height: 144px; }
        .auth-brand-lockup { width: 220px; }
      }
      @media (max-width: 380px) {
        .auth-brand-lockup { width: 200px; }
      }
      @media (min-width: 901px) and (max-width: 1150px) {
        .auth-main { padding: 40px; }
      }
    </style>
  </head>
  <body>
    <main class="auth-shell">
      <header class="auth-brand">
        <div class="auth-brand-lockup">
          <img
            src="/telos-logo.png"
            srcset="/telos-logo@1x.png 375w, /telos-logo.png 750w"
            sizes="(max-width: 900px) 220px, 560px"
            alt="Telos Studio"
            width="750"
            height="318"
          />
        </div>
        <p class="auth-foot">Telos Studio · Team Portal</p>
      </header>
      <section class="auth-main">
        <div class="auth-panel">
          <div class="status-panel" id="status-panel" data-state="pending" aria-live="polite">
            <div id="status-spinner" class="spinner" aria-hidden="true"></div>
            <h1 id="status-title">Checking your verification link…</h1>
            <p id="status-message">One moment please.</p>

            <section id="resend" class="hidden">
              <form id="resend-form">
                <input type="email" id="resend-email" placeholder="your@email.com" aria-label="Email address" required />
                <button type="submit" id="resend-button">Resend</button>
              </form>
              <p class="muted" id="resend-hint">
                Enter your email address and we will send a new verification link.
              </p>
            </section>

            <p class="actions">
              <a id="signin" class="button-link hidden" href="/login">Go to sign in</a>
              <a href="/">Back to Telos</a>
            </p>
          </div>
        </div>
      </section>
    </main>

    <script>
      const panel = document.getElementById('status-panel');
      const spinner = document.getElementById('status-spinner');
      const title = document.getElementById('status-title');
      const message = document.getElementById('status-message');
      const resendSection = document.getElementById('resend');
      const resendForm = document.getElementById('resend-form');
      const resendEmail = document.getElementById('resend-email');
      const resendButton = document.getElementById('resend-button');
      const resendHint = document.getElementById('resend-hint');
      const signin = document.getElementById('signin');

      function showState(kind, heading, text, allowResend) {
        panel.dataset.state = kind;
        spinner.classList.toggle('hidden', kind !== 'pending');
        title.textContent = heading;
        message.textContent = text;
        message.className = kind === 'error' ? 'error' : '';
        resendSection.classList.toggle('hidden', !allowResend);
        signin.classList.toggle('hidden', kind !== 'success');
        if (kind === 'success') signin.focus();
      }

      async function verify(token) {
        try {
          const response = await fetch('/api/auth/verify-email', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token })
          });
          const body = await response.json().catch(() => ({}));
          if (response.ok) {
            showState('success', 'Email verified', 'Your email address is confirmed. Sign in with your email and password to continue.', false);
            return;
          }
          const text = body.code === 'TOKEN_EXPIRED'
            ? 'This verification link has expired. Request a new one below.'
            : 'This verification link is invalid or has already been used. Request a new one below.';
          showState('error', 'Verification failed', text, true);
        } catch (error) {
          showState('error', 'Something went wrong', 'The server could not be reached. Please try again later.', true);
        }
      }

      resendForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        const email = resendEmail.value.trim();
        if (!email) return;
        resendButton.disabled = true;
        resendButton.textContent = 'Sending…';
        try {
          await fetch('/api/auth/resend-verification', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email })
          });
          resendHint.textContent = 'If that email belongs to an unverified account, a new link is on its way.';
        } catch (error) {
          resendHint.textContent = 'The request failed. Please try again in a moment.';
        } finally {
          resendButton.disabled = false;
          resendButton.textContent = 'Resend';
        }
      });

      const token = new URLSearchParams(window.location.search).get('token');
      if (token) {
        verify(token);
      } else {
        showState('error', 'Verification link missing', 'Open the link from your verification email, or request a new one below.', true);
      }
    </script>
  </body>
</html>
