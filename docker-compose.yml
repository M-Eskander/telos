version: '3.8'

services:
  telos-db:
    image: mysql:8.0
    container_name: telos-mysql
    restart: always
    environment:
      # Sets the master root password
      MYSQL_ROOT_PASSWORD: strongpassword
      # Automatically initializes the database you specified
      MYSQL_DATABASE: telos_db
      # Creates the dedicated app user and password
      MYSQL_USER: telos_user
      MYSQL_PASSWORD: strongpassword
    ports:
      - "3306:3306"
    volumes:
      - telos_mysql_data:/var/lib/mysql

  telos-cache:
    image: redis:7-alpine
    container_name: telos-redis
    restart: always
    # Tells Redis to require the password you chose
    command: redis-server --requirepass password
    ports:
      - "6379:6379"

volumes:
  telos_mysql_data: