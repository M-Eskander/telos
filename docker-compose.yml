services:
  telos-db:
    image: mysql:8.0
    container_name: telos-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in the environment}
      # Automatically initializes the database you specified
      MYSQL_DATABASE: telos_db
      # Creates the dedicated app user and password
      MYSQL_USER: telos_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in the environment}
    volumes:
      - telos_mysql_data:/var/lib/mysql

  telos-cache:
    image: redis:7-alpine
    container_name: telos-redis
    restart: always
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?Set REDIS_PASSWORD in the environment}

volumes:
  telos_mysql_data: